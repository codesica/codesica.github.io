name: Build and deploy blog

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'THEME.md', 'templates/**', '.github/workflows/initialize.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout blog source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Check publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{html_url, build_type, source}'
          if test "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)" != workflow; then
            echo '::warning::Settings > Pages > Source should be GitHub Actions. The legacy Jekyll workflow is not needed for Astro.'
          fi
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types and build static site
        run: pnpm build
      - name: Validate generated pages and privacy settings
        run: python3 scripts/verify-site.py
      - name: Install browser verification tool
        run: |
          npm install --global agent-browser
          agent-browser install --with-deps
      - name: Verify desktop mobile navigation and dark mode
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4321 --directory dist > "$RUNNER_TEMP/blog-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true; agent-browser close || true' EXIT
          for n in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:4321/ > /dev/null; then break; fi
            sleep 1
          done
          agent-browser open http://127.0.0.1:4321/
          agent-browser wait --load networkidle
          agent-browser snapshot -i | tee verification/home-snapshot.txt
          agent-browser set viewport 1440 1000
          agent-browser screenshot verification/desktop.png
          agent-browser eval 'if (!document.querySelector("main")) throw new Error("Main content missing"); if (document.documentElement.scrollWidth > innerWidth + 1) throw new Error("Desktop overflow"); "Desktop OK"'
          agent-browser set viewport 390 844
          agent-browser screenshot verification/mobile.png
          agent-browser eval 'if (document.documentElement.scrollWidth > innerWidth + 1) throw new Error("Mobile overflow"); "Mobile OK"'
          agent-browser eval 'window.__previousDark = document.documentElement.classList.contains("dark"); document.querySelector("button[aria-label=\"Switch light/dark theme\"]").click();'
          agent-browser eval 'if (document.documentElement.classList.contains("dark") === window.__previousDark) throw new Error("Theme toggle failed"); "Theme toggle OK"'
          agent-browser screenshot verification/mobile-toggled.png
          agent-browser eval 'document.querySelector("button[aria-label=\"Switch light/dark theme\"]").click();'
          POST_PATH=$(cat verification/first-post.txt)
          if test -n "$POST_PATH"; then
            agent-browser open "http://127.0.0.1:4321$POST_PATH"
            agent-browser wait --load networkidle
            agent-browser snapshot -i | tee verification/article-snapshot.txt
            agent-browser screenshot verification/article-mobile.png
            agent-browser eval 'if (!document.querySelector("main h1")) throw new Error("Article heading missing"); if (document.documentElement.scrollWidth > innerWidth + 1) throw new Error("Article overflow"); "Article OK"'
          fi
          agent-browser open http://127.0.0.1:4321/
          agent-browser eval 'const link = document.querySelector("nav a[href=\"/about/\"]"); if (!link) throw new Error("About navigation missing"); link.click();'
          agent-browser wait --url '**/about/'
          agent-browser wait --load networkidle
          agent-browser eval 'if (!document.querySelector("main")?.textContent.trim()) throw new Error("About page missing"); "Navigation OK"'
          agent-browser errors | tee verification/browser-errors.txt
          agent-browser close
      - name: Save verification reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-verification
          path: verification/
          retention-days: 7
      - name: Upload website for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify exact published version over public HTTPS
        env:
          SITE_URL: https://codesica.github.io
        shell: bash
        run: |
          set -euo pipefail
          VERIFIED=false
          for n in $(seq 1 18); do
            if curl --fail --silent --show-error "$SITE_URL/build.json?verify=$GITHUB_SHA" -o "$RUNNER_TEMP/build.json" && jq -e --arg sha "$GITHUB_SHA" '.commit == $sha' "$RUNNER_TEMP/build.json" > /dev/null; then
              VERIFIED=true
              break
            fi
            sleep 5
          done
          test "$VERIFIED" = true || { echo 'Published version did not match the deployed commit'; exit 1; }
          for path in / /about/ /tags/ /atom.xml /rss.xml /sitemap-index.xml; do
            curl --fail --silent --show-error "$SITE_URL$path" -o /dev/null
            echo "HTTPS OK: $path"
          done
          POST_PATH=$(jq -r '.first_post // ""' "$RUNNER_TEMP/build.json")
          if test -n "$POST_PATH"; then
            curl --fail --silent --show-error "$SITE_URL$POST_PATH" -o /dev/null
            echo "HTTPS OK: $POST_PATH"
          fi
          echo '### Blog published and verified' >> "$GITHUB_STEP_SUMMARY"
          echo 'https://codesica.github.io/' >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
